services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campusx
      POSTGRES_USER: campusx
      POSTGRES_PASSWORD: campusx
    ports:
      - "5432:5432"
    volumes:
      - campusx_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusx -d campusx"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - campusx_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: campusx
      MINIO_ROOT_PASSWORD: campusx-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - campusx_minio:/data

  api:
    build:
      context: ./api
    environment:
      NODE_ENV: development
      PORT: 4000
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://campusx:campusx@postgres:5432/campusx?schema=public
      JWT_SECRET: local-campusx-development-secret-change-me
      JWT_EXPIRES_IN: 7d
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: http://localhost:9000/campusx
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: campusx
      STORAGE_ACCESS_KEY: campusx
      STORAGE_SECRET_KEY: campusx-secret
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  campusx_postgres:
  campusx_redis:
  campusx_minio:
