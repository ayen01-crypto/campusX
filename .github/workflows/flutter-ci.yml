name: CampusX CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze test build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap project platforms and dependencies
        run: bash tool/bootstrap_platforms.sh
      - name: Normalize Dart formatting for validation
        run: dart format lib test
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build web
        run: flutter build web --dart-define=API_BASE_URL=http://localhost:4000/v1

  api:
    name: NestJS Prisma build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://campusx:campusx@localhost:5432/campusx?schema=public
      JWT_SECRET: ci-only-campusx-secret
      JWT_EXPIRES_SECONDS: 604800
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: campusx
      STORAGE_ACCESS_KEY: campusx
      STORAGE_SECRET_KEY: campusx-secret
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package.json
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Build API
        run: npm run build
